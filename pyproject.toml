[project]
name = "plant-village"
version = "0.1.0"
description = "Classificacao de doencas em folhas com TensorFlow e PlantVillage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "importlib-resources>=6.0.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "tensorflow>=2.16.0,<3.0.0",
    "tensorflow-datasets>=4.9.0",
]

[project.scripts]
plant-train = "plant_village.train:main"
plant-evaluate = "plant_village.evaluate:main"
plant-predict = "plant_village.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_village"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
